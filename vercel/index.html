    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

      function getExternalId() {
        var key = '_fbxid';
        try {
          var stored = localStorage.getItem(key);
          if (stored) return stored;
          var newId = 'xid_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
          localStorage.setItem(key, newId);
          return newId;
        } catch (e) { return null; }
      }

      function getCountry() {
        try {
          var lang = navigator.language || '';
          var parts = lang.split('-');
          if (parts.length > 1) return parts[1].toUpperCase();
          return null;
        } catch (e) { return null; }
      }

      function getUtms() {
        var params = new URLSearchParams(window.location.search);
        var utms = {};
        ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','campaign','fbclid','gclid','cid','account_id','bot'].forEach(function (k) {
          var v = params.get(k);
          if (v) utms[k] = v;
        });
        return utms;
      }

      var advancedMatching = {};
      var extId = getExternalId();
      var country = getCountry();
      if (extId) advancedMatching.external_id = extId;
      if (country) advancedMatching.country = country;

      fbq('init', '961619428689288', advancedMatching);

      var pvEventId = 'PageView' + Date.now();
      fbq('track', 'PageView', getUtms(), { eventID: pvEventId });
      window._lastPageViewEventId = pvEventId;

      function dispararLead() {
        var eventId = 'SearchWhats' + Date.now();
        try { fbq('track', 'SearchWhats', getUtms(), { eventID: eventId }); } catch (e) {}
        window._lastLeadEventId = eventId;
        return eventId;
      }
    </script>
